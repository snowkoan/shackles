<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WESP architecture in Shackles</title>
  <desc id="desc">Shackles uses a single high-integrity process containing the Shackles.Wesp integration and espclient.dll. It registers a WESP client, installs session rules, and applies a private context to a launched or attached application process. The application attempts a protected operation through the Windows kernel access path. The wesp.sys driver enforces matching rules for file, process, thread, named pipe, and registry events, and Windows returns allow or access denied. There is no external service or broker.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <style>
      .diagram-title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .region-label { font: 700 17px "Segoe UI", Arial, sans-serif; letter-spacing: 0.12em; fill: #334155; }
      .process-title { font: 700 25px "Segoe UI", Arial, sans-serif; fill: #123b83; }
      .target-title { font: 700 25px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .driver-title { font: 700 27px "Segoe UI", Arial, sans-serif; fill: #8a2c0b; }
      .path-title { font: 700 25px "Segoe UI", Arial, sans-serif; fill: #7c4700; }
      .eyebrow-blue { font: 700 14px "Segoe UI", Arial, sans-serif; letter-spacing: 0.08em; fill: #2563eb; }
      .eyebrow-gray { font: 700 14px "Segoe UI", Arial, sans-serif; letter-spacing: 0.08em; fill: #475569; }
      .eyebrow-purple { font: 700 14px "Segoe UI", Arial, sans-serif; letter-spacing: 0.06em; fill: #7c3aed; }
      .body { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .module { font: 600 17px "Segoe UI", Arial, sans-serif; fill: #173f82; }
      .module-purple { font: 600 17px "Segoe UI", Arial, sans-serif; fill: #5b21b6; }
      .arrow-blue-label { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #1d4ed8; }
      .arrow-purple-label { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #6d28d9; }
      .arrow-red-label { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #b91c1c; }
      .arrow-orange-label { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #9a3412; }
      .arrow-green-label { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #166534; }
      .small { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .kernel-body { font: 500 17px "Segoe UI", Arial, sans-serif; fill: #4b2e16; }
      .footer { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="50" y="50" class="diagram-title">WESP architecture in Shackles</text>

  <!-- User mode -->
  <rect x="50" y="80" width="1500" height="340" fill="#f5f8fc"/>
  <text x="80" y="112" class="region-label">USER MODE</text>

  <!-- Shackles is the only user-mode policy owner; no service is involved. -->
  <rect x="100" y="135" width="790" height="220" rx="16" fill="#edf5ff" stroke="#2563eb" stroke-width="3"/>
  <text x="495" y="178" text-anchor="middle" class="process-title">Shackles.exe process</text>
  <text x="495" y="207" text-anchor="middle" class="eyebrow-blue">HIGH INTEGRITY · SINGLE PROCESS</text>
  <text x="495" y="238" text-anchor="middle" class="body">Owns the WESP Blocking client session and policy</text>

  <rect x="145" y="268" width="280" height="56" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="285" y="302" text-anchor="middle" class="module">Shackles.Wesp</text>

  <rect x="535" y="268" width="300" height="56" rx="7" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="685" y="302" text-anchor="middle" class="module-purple">espclient.dll</text>

  <line x1="445" y1="296" x2="515" y2="296" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="480" y="280" text-anchor="middle" class="arrow-blue-label">NATIVE CALLS</text>

  <!-- The policy target is another ordinary user-mode process. -->
  <rect x="1120" y="135" width="380" height="220" rx="16" fill="#ffffff" stroke="#475569" stroke-width="3"/>
  <text x="1310" y="178" text-anchor="middle" class="target-title">Policy-scoped application</text>
  <text x="1310" y="207" text-anchor="middle" class="eyebrow-gray">LAUNCHED OR ATTACHED PROCESS</text>
  <text x="1310" y="238" text-anchor="middle" class="body">Performs normal Windows operations</text>
  <rect x="1170" y="268" width="280" height="56" rx="7" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1310" y="302" text-anchor="middle" class="module">Private WESP context attached</text>

  <line x1="910" y1="235" x2="1100" y2="235" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="1005" y="211" text-anchor="middle" class="arrow-blue-label">LAUNCH OR SELECT</text>
  <text x="1005" y="261" text-anchor="middle" class="small">policy-scoped target</text>

  <line x1="50" y1="440" x2="1550" y2="440" stroke="#1f2937" stroke-width="4"/>

  <!-- Kernel mode -->
  <rect x="50" y="460" width="1500" height="360" fill="#fff8ee"/>
  <text x="80" y="495" class="region-label" style="fill:#8a2c0b">KERNEL MODE</text>

  <!-- espclient.dll manages WESP client-session state through wesp.sys. -->
  <line x1="685" y1="324" x2="685" y2="515" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text x="710" y="379" class="eyebrow-purple">ESPCLIENT.DLL</text>
  <text x="710" y="404" class="small">register client · install rules · set process context</text>

  <rect x="600" y="535" width="390" height="190" rx="16" fill="#fff0dc" stroke="#c2410c" stroke-width="3"/>
  <text x="795" y="580" text-anchor="middle" class="driver-title">wesp.sys</text>
  <text x="795" y="609" text-anchor="middle" class="eyebrow-gray" style="fill:#9a3412">WESP KERNEL DRIVER</text>
  <line x1="645" y1="629" x2="945" y2="629" stroke="#efc9aa" stroke-width="1.5"/>
  <text x="795" y="661" text-anchor="middle" class="kernel-body">Matches client-session rules for</text>
  <text x="795" y="690" text-anchor="middle" class="kernel-body">Files · Processes · Threads</text>
  <text x="795" y="715" text-anchor="middle" class="kernel-body">Named pipes · Registry keys</text>

  <!-- A policy-scoped process enters the ordinary Windows kernel access path. -->
  <line x1="1260" y1="355" x2="1260" y2="515" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="1135" y="386" class="arrow-red-label">ACCESS ATTEMPT</text>
  <text x="1135" y="411" class="small">protected object operation</text>

  <rect x="1110" y="535" width="390" height="190" rx="16" fill="#fff5cc" stroke="#a16207" stroke-width="3"/>
  <text x="1305" y="580" text-anchor="middle" class="path-title">Windows kernel access path</text>
  <text x="1305" y="609" text-anchor="middle" class="eyebrow-gray" style="fill:#92400e">PROTECTED OBJECT OPERATION</text>
  <line x1="1155" y1="629" x2="1455" y2="629" stroke="#e8c982" stroke-width="1.5"/>
  <text x="1305" y="661" text-anchor="middle" class="kernel-body">File · Registry · Process · Thread</text>
  <text x="1305" y="690" text-anchor="middle" class="kernel-body">Named pipe</text>
  <text x="1305" y="715" text-anchor="middle" class="kernel-body">Returns allow or access denied</text>

  <line x1="990" y1="630" x2="1090" y2="630" stroke="#c2410c" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <text x="1040" y="609" text-anchor="middle" class="arrow-orange-label">ENFORCE POLICY</text>

  <line x1="1450" y1="515" x2="1450" y2="375" stroke="#15803d" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="1470" y="407" class="arrow-green-label">RESULT</text>
  <text x="1470" y="431" class="small">allow or deny</text>

  <text x="800" y="785" text-anchor="middle" class="footer">No external service or broker — the connected Shackles process owns the client-session rules and activity callbacks.</text>
</svg>
